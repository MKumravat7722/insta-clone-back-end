default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV["DATABASE_HOST"] || "localhost" %>
  username: <%= ENV["DATABASE_USERNAME"] || "postgres" %>
  password: <%= ENV["DATABASE_PASSWORD"] || "postgres" %>

development:
  <<: *default
  database: insta_clone_back_end_development

test:
  <<: *default
  database: insta_clone_back_end_test

production:
  <<: *default
  database: <%= ENV['DATABASE_NAME'] || 'insta_clone_back_end_production' %>
  username: <%= ENV['DATABASE_USERNAME'] || 'postgres' %>
  password: <%= ENV['DATABASE_PASSWORD'] || "postgres" %>
  host: <%= ENV['DATABASE_HOST'] || 'localhost' %>
