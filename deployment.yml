apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
          - containerPort: 5432
        env:
          - name: POSTGRES_USER
            value: "rails_user"
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rails-secret
                key: DATABASE_PASSWORD
          - name: POSTGRES_DB
            value: "insta_clone_back_end_development"
        volumeMounts:
          - name: pgdata
            mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          emptyDir: {}
